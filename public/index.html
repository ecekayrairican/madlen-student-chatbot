<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öğrenci Sohbet Asistanı</title>
<style>
  :root {
    --amber: #C96A2E;
    --amber-light: #F5EBE0;
    --ink: #2B2620;
    --muted: #6B6259;
    --border: #E6DCCB;
    --bg: #FBF7F0;
    --bubble-user: #C96A2E;
    --bubble-bot: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 16px 14px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--muted); margin: 0; }

  .setup {
    max-width: 480px;
    margin: 40px auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  .setup label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .setup select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--bg);
    margin-bottom: 16px;
  }
  .setup button {
    width: 100%;
    padding: 14px;
    background: var(--amber);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  #chatScreen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { color: var(--muted); font-style: italic; }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  form#composer input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--bg);
  }
  form#composer button {
    padding: 0 20px;
    background: var(--amber);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  form#composer button:disabled { background: #D8CBB8; cursor: not-allowed; }
  .error {
    margin: 0 12px 10px;
    background: #FBEAEA;
    color: #A32D2D;
    border: 1px solid #F0C7C7;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>
<header>
  <h1>Öğrenci Sohbet Asistanı</h1>
  <p>Sorularını sor, birlikte düşünelim.</p>
</header>

<div class="setup" id="setupScreen">
  <label for="gradeSelect">Sınıf seviyeni seç</label>
  <select id="gradeSelect">
    <option value="1st grade">1. Sınıf</option>
    <option value="2nd grade">2. Sınıf</option>
    <option value="3rd grade">3. Sınıf</option>
    <option value="4th grade">4. Sınıf</option>
    <option value="5th grade" selected>5. Sınıf</option>
    <option value="6th grade">6. Sınıf</option>
    <option value="7th grade">7. Sınıf</option>
    <option value="8th grade">8. Sınıf</option>
    <option value="9th grade">9. Sınıf</option>
    <option value="10th grade">10. Sınıf</option>
    <option value="11th grade">11. Sınıf</option>
    <option value="12th grade">12. Sınıf</option>
  </select>
  <button id="startBtn">Sohbete Başla</button>
</div>

<div id="chatScreen">
  <div id="messages"></div>
  <div class="error" id="errorBox"></div>
  <form id="composer">
    <input id="messageInput" type="text" placeholder="Bir şey sor..." autocomplete="off" />
    <button id="sendBtn" type="submit">Gönder</button>
  </form>
</div>

<script>
let gradeLevel = '';
let history = [];

const setupScreen = document.getElementById('setupScreen');
const chatScreen = document.getElementById('chatScreen');
const messagesEl = document.getElementById('messages');
const composer = document.getElementById('composer');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const errorBox = document.getElementById('errorBox');

document.getElementById('startBtn').addEventListener('click', () => {
  gradeLevel = document.getElementById('gradeSelect').value;
  setupScreen.style.display = 'none';
  chatScreen.style.display = 'flex';
  addMessage('bot', 'Merhaba! Bugün ne öğrenmek istersin? İstediğin şeyi bana sorabilirsin. 🙂');
  messageInput.focus();
});

composer.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text) return;

  errorBox.style.display = 'none';
  addMessage('user', text);
  history.push({ role: 'user', text });
  messageInput.value = '';
  sendBtn.disabled = true;

  const typingEl = addMessage('bot', 'yazıyor...', true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gradeLevel,
        history: history.slice(0, -1),
        message: text,
      }),
    });
    const data = await res.json();

    typingEl.remove();

    if (!res.ok) {
      throw new Error(data.error || 'Bir hata oluştu.');
    }

    addMessage('bot', data.reply);
    history.push({ role: 'model', text: data.reply });
  } catch (err) {
    typingEl.remove();
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  } finally {
    sendBtn.disabled = false;
    messageInput.focus();
  }
});

function addMessage(role, text, isTyping = false) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isTyping ? ' typing' : '');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}
</script>
</body>
</html>
